# OpenSSF Scorecard: scores the repo's supply-chain hardening (pinned actions, token
# permissions, branch protection, code review, signed releases…) weekly and on every push to
# main, publishes the result for the README badge, and lists what to fix in Security → Code
# scanning. It does not gate PRs.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Upload results to code scanning, and sign them so they can be published.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
