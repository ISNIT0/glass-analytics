# Generated by `dataflare ci`. Deploys the Dataflare analytics Worker from .glass/.
#
# The version is pinned in .glass/config.json. To upgrade:
#   npx dataflare-cli@latest upgrade   # stages the new Worker into .glass/
#   git commit .glass && git push            # this workflow migrates and deploys it
#
# Needs repository secret CLOUDFLARE_API_TOKEN: a Cloudflare API token with
# Workers Scripts Edit, D1 Edit, Workers R2 Storage Edit, Account Settings Read
# (and Zone Workers Routes Edit if .glass/config.json has a route).
# Worker secrets (API keys) are set by `dataflare init` and survive deploys.
name: Dataflare

on:
  push:
    branches: [main]
    paths: ['.glass/**', '.github/workflows/glass.yml']
  workflow_dispatch:

concurrency:
  group: glass-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the Dataflare version pinned in .glass/config.json
        run: |
          version="$(node -p "require('./.glass/config.json').version")"
          npx -y "dataflare-cli@${version}" upgrade --ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
