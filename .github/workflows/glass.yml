# Deploys dataflare.dev's own analytics (Worker dataflare-site-analytics, .glass/) from this
# repo's source, so the site always runs the Dataflare it ships. Hand-written: no "Generated by"
# marker, so `dataflare upgrade` and `dataflare ci` leave this file alone.
#
# Runs after every Release run (Release runs on every push to main), so the Worker is built
# from main *after* any version commit and reports the version that was just published.
# Also runs on manual dispatch.
#
# Needs repository secret CLOUDFLARE_API_TOKEN: Workers Scripts Edit, D1 Edit, Workers R2 Storage
# Edit, Account Settings Read. Worker secrets (API keys) were set by `dataflare init` and survive deploys.
name: Dataflare

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: glass-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A failed release means main may hold an unpublished or broken version: skip, don't deploy it.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of main, including the Release workflow's version commit.
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Switch to --frozen-lockfile once pnpm-lock.yaml is committed.
      - run: pnpm install --no-frozen-lockfile
      # Builds the Worker bundle the local CLI deploys (packages/cli/dist/worker).
      - run: pnpm build
      - name: Migrate and deploy the Worker built from this checkout
        run: node packages/cli/dist/glass.js upgrade --ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
