name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Switch to --frozen-lockfile once pnpm-lock.yaml is committed.
      - run: pnpm install --no-frozen-lockfile
      # uv runs the Python half of the lake tests (DataFusion, PyIceberg); required here, so
      # they fail rather than skip if it goes missing.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
        env:
          DATAFLARE_REQUIRE_PYTHON: "1"
      - run: pnpm build
      - run: pnpm size
      - run: node site/build.ts

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Switch to --frozen-lockfile once pnpm-lock.yaml is committed.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
