<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkwell, notes for teams</title>
  <!-- The only line Dataflare needs. data-replay-sample-rate="1" records every session (for the demo). -->
  <script defer src="{{GLASS_HOST}}/s.js" data-project="demo" data-replay-sample-rate="1"></script>
  <link rel="stylesheet" href="data:text/css,body{font:16px/1.5 system-ui;max-width:640px;margin:40px auto;padding:0 20px}a,button{font:inherit}button{padding:8px 14px;border-radius:8px;border:1px solid %23999;background:white;cursor:pointer}nav a{margin-right:12px}">
</head>
<body>
  <nav><a href="/">Home</a><a href="/pricing">Pricing</a><a href="/signup">Sign up</a></nav>
  <h1>Inkwell</h1>
  <p>A demo product instrumented with Dataflare. Click around, then open the Dataflare dashboard.</p>
  <p id="cta"><a href="/pricing">See pricing</a></p>
  <script>
    // Feature flag demo: the "new-cta" flag changes the call to action.
    addEventListener('load', () => {
      window.glass?.onFlags(() => {
        if (window.glass.flag('new-cta') === 'test') {
          document.getElementById('cta').innerHTML = '<a href="/pricing">Start your free trial</a>';
        }
      });
    });
  </script>
</body>
</html>
